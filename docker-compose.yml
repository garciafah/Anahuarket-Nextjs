version: '3.8'

services:
  anahuarket:
    build:
      context: .
      args:
        - DB_HOST=${DB_HOST}
        - DB_PORT=${DB_PORT}
        - DB_USER=${DB_USER}
        - DB_PASSWORD=${DB_PASSWORD}
        - DB_NAME=${DB_NAME}
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - anahuarket-db

  anahuarket-db:
    image: postgres:latest
    container_name: anahuarket-db
    environment:
        POSTGRES_USER: myuser
        POSTGRES_PASSWORD: ysecretpassword
        POSTGRES_DB: mydatabase

    ports:
      - "5433:5432"